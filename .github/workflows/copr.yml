name: COPR package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (e.g. 0.2.12)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build source and binary RPMs
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6

      - name: Build SRPM and binary RPM
        run: |
          set -euo pipefail
          dnf -y install make rpm-build dnf-plugins-core
          make -f .copr/Makefile srpm VERSION='${{ inputs.version }}' outdir="$PWD/dist" spec="$PWD/packaging/copr/filegram.spec"
          dnf -y builddep dist/*.src.rpm
          rpmbuild --rebuild dist/*.src.rpm
          cp /root/rpmbuild/RPMS/x86_64/*.rpm dist/

      - name: Upload RPM packages
        uses: actions/upload-artifact@v7
        with:
          name: filegram-copr-${{ inputs.version }}
          path: |
            dist/*.src.rpm
            dist/*.rpm
